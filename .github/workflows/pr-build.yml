name: PR dev build

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    # Only build when something that can actually affect the app build changed -
    # skips docs/CI-template-only PRs entirely instead of wasting a build on them.
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/pr-build.yml"

# Cancel any in-progress run for the same PR when a new commit is pushed.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  # The instrumented tests, on the emulator app/build.gradle.kts defines (pixel6Api36), which
  # Gradle creates, boots and shuts down itself - the same task `make device-test` runs locally.
  # Not a required check yet: it should prove stable over a few PRs before it can block a merge.
  #
  # Split into shards on parallel runners, one per matrix entry. The runner has no GPU, so the
  # emulator draws in software and the whole suite took about 12 minutes on one. The test runner
  # gives each shard its share of the tests, and together the shards run every test once.
  instrumented-tests:
    name: Instrumented tests (${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # A wedged emulator would otherwise hold the runner for GitHub's default six hours.
    timeout-minutes: 60
    strategy:
      # A failing shard must not cancel the others, or their results go with it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The runner has KVM, but only root may open it, and without it the emulator cannot boot in
      # any useful time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner has no GPU, so the emulator draws in software.
      - name: Run instrumented tests
        run: >-
          ./gradlew pixel6Api36DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.numShards=${{ strategy.job-total }}
          -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ strategy.job-index }}
          --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-tests-pr-${{ github.event.pull_request.number }}-shard-${{ matrix.shard }}
          path: app/build/reports/androidTests/managedDevice/
          retention-days: 14

  # Runs alongside Lint & Test rather than after it, so the APK link arrives about five minutes
  # sooner. A PR that fails lint still gets an APK; the failing check is what stops the merge.
  build-dev:
    runs-on: ubuntu-24.04
    # GitHub withholds repo secrets from workflow runs triggered by Dependabot (by
    # design, so an unreviewed dependency bump can never reach signing material) - this
    # job would otherwise fail with an unsigned/corrupt keystore. Skip it cleanly instead;
    # Lint & Test above still runs and is enough to validate the bump. A human pushing a
    # follow-up commit to the same PR runs as that human, not dependabot[bot], and gets a
    # normal signed build.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # This key signs dev/test builds only. It is separate from the real Play Store
      # release key and is never exposed to forked-repo PRs, since `pull_request`
      # (as opposed to `pull_request_target`) runs without access to repo secrets
      # for forks. The key itself was regenerated (new keystore, alias bedrud-dev) to
      # match this dev rename - the old bedrud-qa key/secrets are retired.
      - name: Decode dev signing key
        run: echo "${{ secrets.BEDRUD_DEV_KEYSTORE_BASE64 }}" | base64 -d > dev-release.jks

      - name: Build dev APK
        env:
          DEV_KEYSTORE_PASSWORD: ${{ secrets.BEDRUD_DEV_KEYSTORE_PASSWORD }}
        # versionCode = this repo's ever-increasing Actions run number, so installing a
        # newer PR's dev build over an older one is always treated as an update by
        # Android (never wiping the tester's data/login) rather than a downgrade.
        run: ./gradlew :app:assembleDev -PdevVersionCode=${{ github.run_number }} --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f dev-release.jks

      - name: Upload universal APK
        id: upload-universal
        uses: actions/upload-artifact@v7
        with:
          name: bedrud-dev-pr-${{ github.event.pull_request.number }}-universal
          path: app/build/outputs/apk/dev/bedrud-dev-universal.apk
          retention-days: 14

      - name: Upload arm64-v8a APK
        id: upload-arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: bedrud-dev-pr-${{ github.event.pull_request.number }}-arm64-v8a
          path: app/build/outputs/apk/dev/bedrud-dev-arm64-v8a.apk
          retention-days: 14

      - name: Upload armeabi-v7a APK
        id: upload-armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          name: bedrud-dev-pr-${{ github.event.pull_request.number }}-armeabi-v7a
          path: app/build/outputs/apk/dev/bedrud-dev-armeabi-v7a.apk
          retention-days: 14

      - name: Upload x86_64 APK
        id: upload-x86_64
        uses: actions/upload-artifact@v7
        with:
          name: bedrud-dev-pr-${{ github.event.pull_request.number }}-x86_64
          path: app/build/outputs/apk/dev/bedrud-dev-x86_64.apk
          retention-days: 14

      # Multiple files under one artifact name download as a single zip containing
      # all of them - no manual zipping needed (and avoids double-zipping, since
      # artifacts are always wrapped in a zip on download regardless of contents).
      - name: Upload all APKs (zip)
        id: upload-all
        uses: actions/upload-artifact@v7
        with:
          name: bedrud-dev-pr-${{ github.event.pull_request.number }}-all
          path: app/build/outputs/apk/dev/*.apk
          retention-days: 14

      # Edits the same comment on every push to this PR (matched via `header`)
      # instead of leaving a new one behind each time.
      - name: Comment build links on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: dev-build
          message: |
            Dev build ready for this PR — installs alongside the real app (package id `com.bedrud.app.dev`) without touching it. Signed into GitHub, download directly:

            | Option | Download |
            |---|---|
            | All architectures (single zip, all 4 APKs) | [Download](${{ steps.upload-all.outputs.artifact-url }}) |
            | Universal (any device — use this if unsure) | [Download](${{ steps.upload-universal.outputs.artifact-url }}) |
            | arm64-v8a (most modern phones) | [Download](${{ steps.upload-arm64-v8a.outputs.artifact-url }}) |
            | armeabi-v7a (older 32-bit phones) | [Download](${{ steps.upload-armeabi-v7a.outputs.artifact-url }}) |
            | x86_64 (emulators) | [Download](${{ steps.upload-x86_64.outputs.artifact-url }}) |

            Each downloads as a `.zip` (GitHub wraps every artifact); unzip to get the `.apk`.
